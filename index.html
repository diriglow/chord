<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191b1b"><meta name="apple-mobile-web-app-capable" content="yes"><title>chord. — songwriting studio</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css"></head><body><main>
<header><div><h1>chord<span>.</span></h1><small>SONGWRITING STUDIO</small></div><div class="controls"><label>KEY<select id="key"></select></label><label>MODE<select id="mode"></select></label><label>CHORD TYPE<select id="kind"><option>Triads</option><option selected>7ths</option><option>9ths</option><option>Sus2</option><option>Sus4</option></select></label></div></header>
<section><div class="row spread"><small>PROGRESSION</small><div class="row"><button id="undo" class="quiet">Undo</button><button id="clear" class="quiet">Clear</button></div></div><div id="seq" class="sequence"></div><div class="row"><button class="primary" id="play">▶ Play loop</button><label class="tempo">BPM <input type="number" id="bpm" min="40" max="220" value="90"></label><button id="export">Export MIDI</button><button id="copy">Copy</button></div></section>
<section><div class="row spread"><small>ADD CHORD</small><small id="scale"></small></div><div class="palette" id="palette"></div><div class="row custom"><select id="customRoot" aria-label="Custom root"></select><select id="customType" aria-label="Custom chord type"></select><button id="custom">+ Custom chord</button></div></section>
<section><div class="row spread"><h2 id="name"></h2><span id="notes" class="muted"></span><button id="hear">♪ Audition</button></div><div class="diagrams"><div><small>GUITAR</small><div id="guitar"></div><div class="row spread"><button id="prev" aria-label="Previous shape">‹</button><small id="shape"></small><button id="next" aria-label="Next shape">›</button></div></div><div><small>PIANO</small><div id="piano"></div><div class="row spread"><button id="inv">Inversion</button><small id="invLabel"></small></div></div></div></section>
<footer>Standard tuning · E A D G B E <br>Progression saved on this device<br><span id="appVersion">v1.3</span> · <button id="refreshApp" class="quiet" type="button">Check for updates ↻</button></footer></main><script src="./app.js?v=1.3"></script></body></html>
